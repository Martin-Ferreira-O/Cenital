<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cenital — Builder</title>
<link rel="stylesheet" href="../viewer/venue-map.css">
<link rel="stylesheet" href="./builder.css">
</head>
<body>
<header id="header" class="bld-header"></header>
<div id="banner" class="bld-banner" hidden></div>
<main class="bld-main">
  <nav id="rail" class="bld-rail"></nav>
  <div class="bld-stage">
    <div id="preview-note" class="bld-preview-note">Así verá el mapa el público en tu sitio — con leyenda, tooltips y pan/zoom.</div>
    <div class="bld-stage-body">
      <div id="canvas" class="bld-canvas vm-scope"></div>
      <div id="preview" class="bld-preview"></div>
      <div id="empty-card"></div>
    </div>
    <div class="bld-statusbar"><span id="status-l"></span><span id="status-r"></span></div>
  </div>
  <aside class="bld-side">
    <div id="steps" class="bld-steps"></div>
    <div id="inspector" class="bld-panel"></div>
    <div id="tiers" class="bld-panel" hidden></div>
  </aside>
</main>
<script type="module" src="./app.js"></script>
</body>
</html>
