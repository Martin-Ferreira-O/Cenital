<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Club Íntimo — preview</title>
<link rel="stylesheet" href="./viewer/venue-map.css">
<style>
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #050508;
    font-family: 'Inter', -apple-system, system-ui, sans-serif;
  }
  #map { width: min(1200px, 94vw); height: min(720px, 88vh); }
</style>
</head>
<body>
<div id="map"></div>
<script type="module">
  import { VenueMap } from './viewer/index.js';
  const params = new URLSearchParams(location.search);
  const theme = params.get('theme') || 'dark';
  if (theme === 'light') document.body.style.background = '#e8e7e3';
  const map = new VenueMap('#map', {
    url: params.get('venue') || '../examples/club-intimo.json',
    theme,
  });
  map.on('select', (e) => console.log('select', e));
</script>
</body>
</html>
